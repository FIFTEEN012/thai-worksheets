<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ดูคะแนน · OpenWorksheets ภาษาไทย</title>
  <meta name="description" content="ดูคะแนนที่นักเรียนส่งออนไลน์ แยกตามใบงานและห้องเรียน">
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <script>(function(){var t=localStorage.getItem('wpf-tema');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
  <style>
    .rs-login { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
    .rs-login input { min-width: 220px; }
    .rs-filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin: 14px 0 6px; align-items: end; }
    .rs-filters select { width: 100%; }
    .rs-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 14px 0; }
    .rs-stat { border: 1px solid var(--tinta-tenue); border-radius: 10px; padding: 10px 12px; }
    .rs-stat b { display: block; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
    .rs-stat span { color: var(--tinta-suave); font-size: 0.85rem; }
    .rs-actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 12px; }
    .rs-num { text-align: right; font-variant-numeric: tabular-nums; }
    .rs-detail td { background: color-mix(in srgb, var(--azul-claro) 10%, transparent); cursor: default; }
    .rs-detail table { width: 100%; border-collapse: collapse; }
    .rs-detail th, .rs-detail td td { padding: 3px 6px; }
    .rs-ok { color: var(--verde); } .rs-bad { color: var(--rojo); } .rs-pend { color: #b45309; }
    .rs-msg { margin-top: 10px; }
    .rs-classsum { margin: 6px 0 14px; }
  </style>
</head>
<body>

  <header class="topbar">
    <a class="brand" href="index.html" title="กลับหน้าหลัก">OpenWorksheets <span class="tag">ดูคะแนน</span></a>
    <span class="spacer"></span>
    <button class="btn small ghost" id="btnTema" title="ธีม: อัตโนมัติ (ตามระบบ)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8M12 17v4"/></svg></button>
    <a class="btn small" href="index.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon"><path d="m12 19-7-7 7-7M19 12H5"/></svg> กลับหน้าหลัก</a>
  </header>

  <main class="page-wrap">
    <section class="card steps-box anim-in">
      <h1 class="page-title">ดูคะแนนนักเรียน</h1>
      <p>คะแนนที่นักเรียนส่งออนไลน์จากใบงานที่เปิด «ส่งคะแนนให้ครูอัตโนมัติ» ไว้ เลือกใบงานและห้องเรียนเพื่อดูผล</p>

      <form class="rs-login" id="rsLogin">
        <div>
          <label class="f-label" for="rsKey">รหัสครู</label>
          <input type="password" id="rsKey" autocomplete="current-password" required>
        </div>
        <label class="check-row" style="margin:0 0 8px"><input type="checkbox" id="rsRemember" checked> จำรหัสในเครื่องนี้</label>
        <button class="btn primary" type="submit" id="rsGo">ดูคะแนน</button>
      </form>
      <p class="rs-msg" id="rsMsg" hidden></p>

      <div id="rsApp" hidden>
        <div class="rs-filters">
          <div>
            <label class="f-label" for="rsFicha">ใบงาน</label>
            <select id="rsFicha"></select>
          </div>
          <div>
            <label class="f-label" for="rsClase">ห้องเรียน</label>
            <select id="rsClase"></select>
          </div>
          <div>
            <label class="f-label" for="rsBuscar">ค้นหาชื่อ</label>
            <input type="search" id="rsBuscar" placeholder="พิมพ์ชื่อนักเรียน…" style="width:100%">
          </div>
          <label class="check-row" style="margin:0 0 8px"><input type="checkbox" id="rsLatest" checked> แสดงเฉพาะครั้งล่าสุดของแต่ละคน</label>
        </div>

        <div class="rs-stats" id="rsStats"></div>
        <div class="rs-classsum class-table-wrap" id="rsClassSum"></div>

        <div class="rs-actions">
          <button class="btn" type="button" id="rsReload">↻ โหลดใหม่</button>
          <button class="btn" type="button" id="rsCsv">ส่งออก CSV</button>
          <a class="btn" id="rsSheet" target="_blank" rel="noopener">เปิดใน Google Sheets</a>
          <button class="btn ghost" type="button" id="rsLogout">ออกจากระบบ</button>
        </div>

        <div class="class-table-wrap">
          <table class="class-table" id="rsTable"></table>
        </div>
        <p><small>คลิกที่แถวเพื่อดูคำตอบรายข้อ</small></p>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="js/theme.js"></script>
  <script type="module" src="js/resultados.js"></script>
</body>
</html>
